 <!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - 欢迎回来</title>
  <style>
    /* ============ 全局重置与基础样式 ============ */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary-color: #6366f1;
      --primary-dark: #4f46e5;
      --primary-light: #818cf8;
      --text-color: #1f2937;
      --text-muted: #6b7280;
      --border-color: #e5e7eb;
      --error-color: #ef4444;
      --success-color: #10b981;
      --bg-gradient-start: #6a11cb;
      --bg-gradient-end: #2575fc;
      --white: #ffffff;
      --shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
        'Helvetica Neue', Arial, 'PingFang SC', 'Hiragino Sans GB',
        'Microsoft YaHei', sans-serif;
      background: linear-gradient(
        135deg,
        var(--bg-gradient-start),
        var(--bg-gradient-end)
      );
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: var(--text-color);
    }

    body::before,
    body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.4;
      z-index: 0;
    }

    body::before {
      width: 400px;
      height: 400px;
      background: var(--primary-light);
      top: -100px;
      left: -100px;
    }

    body::after {
      width: 350px;
      height: 350px;
      background: #f59e0b;
      bottom: -100px;
      right: -100px;
    }

    .login-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
    }

    .login-card {
      background: var(--white);
      border-radius: 20px;
      box-shadow: var(--shadow);
      padding: 40px 36px;
      animation: fadeInUp 0.6s ease-out;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .brand {
      text-align: center;
      margin-bottom: 32px;
    }

    .logo {
      width: 64px;
      height: 64px;
      margin: 0 auto 16px;
      background: linear-gradient(
        135deg,
        var(--primary-color),
        var(--primary-dark)
      );
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 28px;
      box-shadow: 0 8px 24px rgba(99, 102, 241, 0.4);
    }

    .brand h1 {
      font-size: 24px;
      font-weight: 700;
      color: var(--text-color);
      margin-bottom: 6px;
    }

    .brand p {
      color: var(--text-muted);
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-color);
    }

    .input-wrapper {
      position: relative;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 16px;
      opacity: 0.6;
      pointer-events: none;
    }

    .input-wrapper input {
      width: 100%;
      padding: 12px 44px 12px 42px;
      font-size: 14px;
      border: 1.5px solid var(--border-color);
      border-radius: 10px;
      transition: border-color 0.3s, box-shadow 0.3s;
      outline: none;
      color: var(--text-color);
    }

    .input-wrapper input::placeholder {
      color: #9ca3af;
    }

    .input-wrapper input:focus {
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
    }

    .input-wrapper input.error {
      border-color: var(--error-color);
    }

    .error-message {
      display: block;
      min-height: 18px;
      margin-top: 6px;
      font-size: 12px;
      color: var(--error-color);
    }

    .submit-btn {
      width: 100%;
      padding: 13px;
      background: linear-gradient(
        135deg,
        var(--primary-color),
        var(--primary-dark)
      );
      color: var(--white);
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.3s;
      position: relative;
    }

    .submit-btn:hover {
      box-shadow: 0 8px 24px rgba(99, 102, 241, 0.45);
      transform: translateY(-2px);
    }

    .toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(-100%);
      background: var(--text-color);
      color: var(--white);
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 14px;
      z-index: 1000;
      transition: transform 0.4s ease, opacity 0.4s ease;
      opacity: 0;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
      max-width: 90%;
      text-align: center;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    .toast.success {
      background: var(--success-color);
    }

    .toast.error {
      background: var(--error-color);
    }

    .register-link {
      text-align: center;
      font-size: 14px;
      color: var(--text-muted);
      margin-top: 20px;
    }

    .register-link a {
      color: var(--primary-color);
      text-decoration: none;
      font-weight: 500;
    }

    .register-link a:hover {
      text-decoration: underline;
    }

    @media (max-width: 480px) {
      .login-card {
        padding: 30px 24px;
      }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <!-- 品牌区域 -->
      <div class="brand">
        <div class="logo">🌐</div>
        <h1>欢迎回来</h1>
        <p>登录您的账号以继续</p>
      </div>

      <!-- 登录表单 -->
      <form id="loginForm" class="login-form" novalidate>
        <!-- 用户名（必须为中文） -->
        <div class="form-group">
          <label for="username">用户名</label>
          <div class="input-wrapper">
            <span class="input-icon">👤</span>
            <input
              type="text"
              id="username"
              name="username"
              placeholder="请输入中文用户名"
              autocomplete="username"
              required
            >
          </div>
          <small class="error-message" id="usernameError"></small>
        </div>

        <!-- 密码（必须包含英文与数字） -->
        <div class="form-group">
          <label for="password">密码</label>
          <div class="input-wrapper">
            <span class="input-icon">🔒</span>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="请输入密码（需包含英文和数字）"
              autocomplete="current-password"
              required
            >
          </div>
          <small class="error-message" id="passwordError"></small>
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">登 录</button>
      </form>

      <p class="register-link">
        还没有账号？<a href="#">立即注册</a>
      </p>
    </div>
  </div>

  <!-- 提示消息 Toast -->
  <div class="toast" id="toast"></div>

  <script src="login.js"></script>
</body>
</html>
