<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Chat · 智能助手</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <!-- ============ 侧边栏 ============ -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <button class="new-chat-btn" id="newChatBtn">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M12 5v14M5 12h14"/></svg>
          <span>新对话</span>
        </button>
      </div>

      <nav class="conversation-list" id="conversationList">
        <!-- 会话项将动态渲染 -->
      </nav>

      <div class="sidebar-footer">
        <div class="user-info">
          <div class="avatar">助</div>
          <div class="user-detail">
            <span class="user-name">AI 助手</span>
            <span class="user-status">在线</span>
          </div>
        </div>
      </div>
    </aside>

    <!-- ============ 主聊天区 ============ -->
    <main class="chat-main">
      <!-- 顶部栏 -->
      <header class="chat-header">
        <div class="header-title">
          <h1>AI 智能助手</h1>
          <span class="model-badge">GPT-4 · 联网</span>
        </div>
        <div class="header-actions">
          <button class="icon-btn" title="清空对话" id="clearBtn">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
          </button>
          <button class="icon-btn" title="新建对话" id="newChatBtnTop">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M12 5v14M5 12h14"/></svg>
          </button>
        </div>
      </header>

      <!-- 消息区域 -->
      <div class="messages-container" id="messagesContainer"></div>

      <!-- 输入区域 -->
      <div class="input-container">
        <div class="input-wrapper" id="inputWrapper">
          <textarea id="promptInput" rows="1" placeholder="给 AI 助手发送消息…" autocomplete="off"></textarea>
          <div class="input-actions">
            <button class="send-btn" id="sendBtn" disabled>
              <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
            </button>
          </div>
        </div>
        <p class="footer-note">AI 生成内容仅供参考</p>
      </div>
    </main>
  </div>

  <!-- 机器人思考动画 -->
  <div class="loading-indicator" id="loadingIndicator">
    <div class="thinking-row">
      <div class="message-avatar">🤖</div>
      <div class="thinking-bubble">
        <div class="typing-dots">
      <span></span><span></span><span></span>
    </div>
        <span class="thinking-text">正在思考…</span>
  </div>
    </div>
  </div>

  <script src="chat-stream.js"></script>
</body>
</html>
