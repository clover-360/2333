<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - 欢迎回来</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 背景壁纸装饰层 -->
  <div class="bg-decor" aria-hidden="true">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="grid-overlay"></div>
  </div>

  <div class="login-container">
    <div class="login-card">
      <!-- 品牌区域 -->
      <div class="brand">
        <div class="logo">🌐</div>
        <h1>欢迎回来</h1>
        <p>登录您的账号以继续</p>
      </div>

      <!-- 登录表单 -->
      <form id="loginForm" class="login-form" novalidate>
        <!-- 用户名 -->
        <div class="form-group">
          <label for="username">用户名</label>
          <div class="input-wrapper">
            <span class="input-icon">👤</span>
            <input
              type="text"
              id="username"
              name="username"
              placeholder="请输入用户名"
              autocomplete="username"
              required
            >
          </div>
          <small class="error-message" id="usernameError"></small>
        </div>

        <!-- 邮箱 -->
        <div class="form-group">
          <label for="email">邮箱</label>
          <div class="input-wrapper">
            <span class="input-icon">✉️</span>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="请输入邮箱地址"
              autocomplete="email"
              required
            >
          </div>
          <small class="error-message" id="emailError"></small>
        </div>

        <!-- 密码 -->
        <div class="form-group">
          <label for="password">密码</label>
          <div class="input-wrapper">
            <span class="input-icon">🔒</span>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="请输入密码"
              autocomplete="current-password"
              required
            >
            <button type="button" class="toggle-password" id="togglePassword" aria-label="显示密码">
              👁
        </button>
      </div>
          <small class="error-message" id="passwordError"></small>
      </div>

        <div class="form-options">
          <label class="checkbox">
            <input type="checkbox" id="remember" name="remember">
            <span>记住我</span>
          </label>
          <a href="#" class="forgot-password">忘记密码？</a>
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">
          <span class="btn-text">登 录</span>
          <span class="btn-loading" id="btnLoading">登录中...</span>
        </button>
      </form>

      <!-- 分隔线 -->
      <div class="divider">
        <span>或</span>
  </div>

      <!-- 第三方登录 -->
      <div class="social-login">
        <button type="button" class="social-btn wechat" onclick="showToast('暂未开放微信登录')">
          <span class="social-icon">💬</span>
          微信登录
        </button>
        <button type="button" class="social-btn github" onclick="showToast('暂未开放GitHub登录')">
          <span class="social-icon">💻</span>
          GitHub 登录
        </button>
      </div>

      <p class="register-link">
        还没有账号？<a href="#">立即注册</a>
      </p>
    </div>

    <p class="footer">© 2024 Your Company. 保留所有权利。</p>
  </div>

    <!-- 提示消息 -->
  <div class="toast" id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
